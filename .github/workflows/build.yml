name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
      - run: pyinstaller --noconsole --onefile --name "AntiPornGuard" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AntiPornGuard-exe
          path: dist/AntiPornGuard.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: dist/AntiPornGuard.exe
